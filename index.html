<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbital">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05060d">
<title>Orbital</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap">
<style>
:root{--bg:#05060d;--cy:#5ff3ff;--mg:#ff4fd8;--am:#ffb347;--tx:#d7f7ff;--mut:#6f8aa0;--font:"Russo One","Arial Black",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:var(--font);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;pointer-events:none;font-size:13px;letter-spacing:.08em}
#hud small{display:block;color:var(--mut);font-size:10px;letter-spacing:.18em}
#score{font-size:28px;color:var(--cy);text-shadow:0 0 12px rgba(95,243,255,.6);font-variant-numeric:tabular-nums}
#mult{color:var(--am);font-size:15px;min-height:1.2em}
.right{text-align:right}
#hull{display:flex;gap:5px;justify-content:flex-end;margin-top:4px}
#hull i{width:16px;height:7px;background:var(--mg);box-shadow:0 0 8px var(--mg);transform:skewX(-20deg)}
#hull i.off{background:#2a1530;box-shadow:none}
#weap{margin-top:5px;color:var(--cy)}
#snd{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:none;border:1px solid #27465a;color:var(--mut);font:inherit;font-size:11px;letter-spacing:.12em;padding:8px 12px;border-radius:4px}
#snd:focus-visible{outline:2px solid var(--cy)}
#ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,rgba(5,6,13,.55),rgba(5,6,13,.9))}
#ov[hidden]{display:none}
#ttl{font-size:clamp(44px,15vw,84px);letter-spacing:.14em;margin:0;color:var(--cy);text-shadow:0 0 24px rgba(95,243,255,.7),0 0 60px rgba(95,243,255,.3)}
#sub{margin:0;color:var(--tx);font-size:16px;letter-spacing:.1em;line-height:1.5;max-width:22em}
#best{color:var(--am);font-size:14px;letter-spacing:.14em}
#go{margin-top:8px;font-size:18px;letter-spacing:.2em;color:var(--bg);background:var(--cy);padding:14px 30px;border-radius:3px;box-shadow:0 0 24px rgba(95,243,255,.55);animation:pulse 1.3s ease-in-out infinite}
#help{color:var(--mut);font-size:12px;letter-spacing:.08em;line-height:1.6}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){#go{animation:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" aria-live="off">
  <div><small>СЧЁТ</small><div id="score">0</div><div id="mult"></div></div>
  <div class="right"><small>КОРПУС</small><div id="hull"></div><div id="weap"></div></div>
</div>
<div id="ov">
  <h1 id="ttl">ORBITAL</h1>
  <p id="sub">Защити орбиту от волн дронов</p>
  <div id="best"></div>
  <div id="go">ТАП — СТАРТ</div>
  <div id="help">Веди корабль пальцем, огонь ведётся сам.<br>Зелёный — оружие, синий — щит, розовый — ремонт.</div>
</div>
<button id="snd" type="button">ЗВУК: ВКЛ</button>

<script>
(function(){
var $=function(i){return document.getElementById(i);};
var cv=$('cv'),ctx=cv.getContext('2d'),W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);}
window.addEventListener('resize',resize);resize();

/* ---------- storage / sound ---------- */
var best=0,muted=false;
try{best=+localStorage.getItem('orbital-best')||0;muted=localStorage.getItem('orbital-mute')==='1';}catch(e){}
var AC=null;
function audio(){try{if(!AC){var K=window.AudioContext||window.webkitAudioContext;if(!K)return null;AC=new K();}if(AC.state==='suspended')AC.resume();return AC;}catch(e){return null;}}
function tone(f,d,at,type,vol,slide){var a=audio();if(!a||muted)return;var t=a.currentTime+(at||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.05,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.02);}
var SFX={
  shoot:function(){tone(880,0.05,0,'triangle',0.015,440);},
  boom:function(){tone(180,0.22,0,'sawtooth',0.07,40);},
  big:function(){tone(120,0.4,0,'sawtooth',0.1,30);tone(300,0.2,0,'square',0.05,60);},
  hit:function(){tone(150,0.3,0,'sawtooth',0.1,50);},
  pick:function(){tone(660,0.07,0,'square',0.05);tone(990,0.1,0.07,'square',0.05);},
  start:function(){[330,440,660].forEach(function(f,i){tone(f,0.09,i*0.07,'square',0.05);});},
  over:function(){[392,330,262,196].forEach(function(f,i){tone(f,0.25,i*0.2,'sawtooth',0.06);});}
};
function sfx(n){try{SFX[n]();}catch(e){}}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}
function setSndLabel(){$('snd').textContent='ЗВУК: '+(muted?'ВЫКЛ':'ВКЛ');}
setSndLabel();
$('snd').addEventListener('click',function(e){e.stopPropagation();muted=!muted;try{localStorage.setItem('orbital-mute',muted?'1':'0');}catch(er){}setSndLabel();if(!muted){audio();sfx('pick');}});
$('snd').addEventListener('pointerdown',function(e){e.stopPropagation();});

/* ---------- game state ---------- */
var state='menu',overAt=0;
var G,ship,E,B,EB,PU,PT,stars=[];
for(var i=0;i<80;i++)stars.push({x:Math.random(),y:Math.random(),z:Math.random()});
var tx=0,ty=0,keys={};
function reset(){
  G={t:0,score:0,mult:1,comboT:0,spawn:0.6,shake:0};
  ship={x:W/2,y:H*0.78,hp:3,shield:false,inv:0,w:1,fire:0};
  tx=ship.x;ty=ship.y;E=[];B=[];EB=[];PU=[];PT=[];
  drawHud(true);
}
var lastScore=-1,lastHp=-1,lastW=-1,lastMult=-1;
function drawHud(force){
  if(force||G.score!==lastScore){lastScore=G.score;$('score').textContent=G.score;}
  if(force||G.mult!==lastMult){lastMult=G.mult;$('mult').textContent=G.mult>1?'×'+G.mult+' КОМБО':'';}
  if(force||ship.hp!==lastHp){lastHp=ship.hp;var h='';for(var i=0;i<3;i++)h+='<i class="'+(i<ship.hp?'':'off')+'"></i>';$('hull').innerHTML=h;}
  if(force||ship.w!==lastW){lastW=ship.w;$('weap').textContent='ОРУЖИЕ '+ship.w+'/3';}
}
function showOv(title,sub,btn){
  $('ttl').textContent=title;$('sub').innerHTML=sub;$('go').textContent=btn;
  $('best').textContent=best?'РЕКОРД: '+best:'';
  $('help').style.display=state==='menu'?'':'none';
  $('ov').hidden=false;
}
function start(){reset();state='play';$('ov').hidden=true;sfx('start');audio();}
function over(){
  state='over';overAt=performance.now();sfx('over');buzz(120);
  var nb=G.score>best;
  if(nb){best=G.score;try{localStorage.setItem('orbital-best',String(best));}catch(e){}}
  showOv('ВЗЛОМ КОРПУСА','СЧЁТ: '+G.score+(nb?'<br>НОВЫЙ РЕКОРД!':''),'ЕЩЁ РАЗ');
}
showOv('ORBITAL','Защити орбиту от волн дронов','ТАП — СТАРТ');
reset();

/* ---------- input ---------- */
function pt(e){tx=e.clientX;ty=e.clientY-(e.pointerType==='touch'?70:0);}
window.addEventListener('pointerdown',function(e){
  if(state==='menu'||(state==='over'&&performance.now()-overAt>700)){pt(e);start();return;}
  if(state==='pause'){state='play';$('ov').hidden=true;return;}
  pt(e);
});
window.addEventListener('pointermove',function(e){if(state==='play'&&(e.pointerType!=='touch'||e.buttons||e.pressure>0))pt(e);});
window.addEventListener('keydown',function(e){
  keys[e.key.toLowerCase()]=true;
  if((e.key===' '||e.key==='Enter')&&(state==='menu'||(state==='over'&&performance.now()-overAt>500)))start();
  if(e.key==='p'&&state==='play'){state='pause';showOv('ПАУЗА','Тап — продолжить','ПРОДОЛЖИТЬ');}
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false;});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play'){state='pause';showOv('ПАУЗА','Тап — продолжить','ПРОДОЛЖИТЬ');}});
['gesturestart','contextmenu','dblclick'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();});});

/* ---------- spawning ---------- */
function spawn(){
  var t=G.t,r=Math.random(),x=34+Math.random()*(W-68),e;
  if(t>28&&r<0.14)e={k:'tank',x:x,y:-34,vy:55,hp:7,r:24,sc:60,sh:1.4,stop:H*0.2};
  else if(t>10&&r<0.42)e={k:'weaver',x:x,y:-20,vy:85,hp:2,r:15,sc:25,ph:Math.random()*6,ax:Math.max(70,Math.min(W-70,x))};
  else e={k:'drone',x:x,y:-20,vy:100+Math.min(t*2.2,130),hp:1,r:13,sc:10};
  e.max=e.hp;E.push(e);
}
function boom(x,y,col,n,sp){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=(0.3+Math.random())*(sp||160);PT.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:0.5+Math.random()*0.4,m:0.9,c:col});}}
function kill(e){
  var big=e.k==='tank';
  boom(e.x,e.y,e.k==='drone'?'#ff5a5a':e.k==='weaver'?'#c28bff':'#ffb347',big?34:16,big?240:170);
  sfx(big?'big':'boom');G.shake=Math.max(G.shake,big?10:3);
  G.mult=Math.min(8,G.mult+1);G.comboT=2.2;
  G.score+=e.sc*G.mult;
  if(Math.random()<(big?0.7:0.09)){var q=Math.random(),k=q<0.45?'W':q<0.75?'S':'H';PU.push({k:k,x:e.x,y:e.y,vy:70,a:0});}
}
function hurt(){
  if(ship.inv>0)return;
  if(ship.shield){ship.shield=false;ship.inv=0.8;sfx('hit');boom(ship.x,ship.y,'#7aa7ff',14,200);G.shake=6;return;}
  ship.hp--;ship.inv=1.4;sfx('hit');buzz(60);G.shake=12;boom(ship.x,ship.y,'#ff4fd8',22,220);
  ship.w=Math.max(1,ship.w-1);
  if(ship.hp<=0){boom(ship.x,ship.y,'#5ff3ff',50,300);ship.dead=true;over();}
}

/* ---------- update ---------- */
function update(dt){
  G.t+=dt;
  // input via keys
  var kx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0),ky=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0);
  if(kx||ky){tx=ship.x+kx*200;ty=ship.y+ky*200;}
  tx=Math.max(18,Math.min(W-18,tx));ty=Math.max(H*0.2,Math.min(H-40,ty));
  var k=1-Math.pow(0.0005,dt);
  ship.x+=(tx-ship.x)*k;ship.y+=(ty-ship.y)*k;
  if(ship.inv>0)ship.inv-=dt;
  // combo
  if(G.comboT>0){G.comboT-=dt;if(G.comboT<=0)G.mult=1;}
  // fire
  ship.fire-=dt;
  if(ship.fire<=0){
    ship.fire=0.17;
    var s=ship;
    if(s.w===1)B.push({x:s.x,y:s.y-16,vx:0,vy:-720});
    else if(s.w===2){B.push({x:s.x-8,y:s.y-12,vx:0,vy:-720});B.push({x:s.x+8,y:s.y-12,vx:0,vy:-720});}
    else{B.push({x:s.x,y:s.y-16,vx:0,vy:-740});B.push({x:s.x-9,y:s.y-10,vx:-110,vy:-700});B.push({x:s.x+9,y:s.y-10,vx:110,vy:-700});}
    sfx('shoot');
  }
  // spawn
  G.spawn-=dt;
  if(G.spawn<=0){spawn();G.spawn=Math.max(0.3,1.0-G.t*0.009)*(0.7+Math.random()*0.6);}
  // bullets
  for(var i=B.length-1;i>=0;i--){var b=B[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<-20||b.x<-20||b.x>W+20)B.splice(i,1);}
  for(i=EB.length-1;i>=0;i--){var q=EB[i];q.x+=q.vx*dt;q.y+=q.vy*dt;
    if(q.y>H+20||q.y<-20||q.x<-20||q.x>W+20){EB.splice(i,1);continue;}
    if(Math.hypot(q.x-ship.x,q.y-ship.y)<14){EB.splice(i,1);hurt();}}
  // enemies
  for(i=E.length-1;i>=0;i--){
    var e=E[i];
    if(e.k==='weaver'){e.y+=e.vy*dt;e.x=e.ax+Math.sin(e.ph+G.t*2.6)*62;}
    else if(e.k==='tank'){
      e.y+=(e.y<e.stop?e.vy:12)*dt;e.sh-=dt;
      if(e.sh<=0&&e.y>20){e.sh=1.5;var a=Math.atan2(ship.y-e.y,ship.x-e.x);EB.push({x:e.x,y:e.y+14,vx:Math.cos(a)*230,vy:Math.sin(a)*230});}
    }else e.y+=e.vy*dt;
    if(e.y>H+50){E.splice(i,1);continue;}
    // bullets hit
    for(var j=B.length-1;j>=0;j--){
      var bb=B[j];
      if(Math.abs(bb.x-e.x)<e.r+4&&Math.abs(bb.y-e.y)<e.r+8){B.splice(j,1);e.hp--;e.f=0.06;boom(bb.x,bb.y,'#ffffff',2,90);if(e.hp<=0)break;}
    }
    if(e.f>0)e.f-=dt;
    if(e.hp<=0){kill(e);E.splice(i,1);continue;}
    if(Math.hypot(e.x-ship.x,e.y-ship.y)<e.r+11){
      hurt();boom(e.x,e.y,'#ff8a5a',14,170);E.splice(i,1);
    }
  }
  // powerups
  for(i=PU.length-1;i>=0;i--){var p=PU[i];p.y+=p.vy*dt;p.a+=dt*3;
    if(p.y>H+30){PU.splice(i,1);continue;}
    if(Math.hypot(p.x-ship.x,p.y-ship.y)<26){
      PU.splice(i,1);sfx('pick');boom(p.x,p.y,'#ffffff',10,120);
      if(p.k==='W')ship.w=Math.min(3,ship.w+1);
      else if(p.k==='S')ship.shield=true;
      else ship.hp=Math.min(3,ship.hp+1);
      G.score+=25;
    }}
  // particles
  for(i=PT.length-1;i>=0;i--){var r=PT[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.vx*=0.98;r.vy*=0.98;r.l-=dt;if(r.l<=0)PT.splice(i,1);}
  if(G.shake>0)G.shake=Math.max(0,G.shake-dt*40);
  drawHud(false);
}

/* ---------- render ---------- */
function poly(pts){ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(var i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();}
function glow(c,w,b){ctx.strokeStyle=c;ctx.lineWidth=w||2;ctx.shadowColor=c;ctx.shadowBlur=b===undefined?10:b;}
function render(dt){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#05060d';ctx.fillRect(0,0,W,H);
  var g=ctx.createRadialGradient(W/2,H*1.1,10,W/2,H*1.1,H*0.9);g.addColorStop(0,'rgba(30,60,120,.35)');g.addColorStop(1,'rgba(5,6,13,0)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // stars
  var sp=state==='play'?1:0.25;
  ctx.fillStyle='#9fd8ff';
  for(var i=0;i<stars.length;i++){var s=stars[i];s.y+=dt*(30+s.z*180)*sp/H;if(s.y>1){s.y=0;s.x=Math.random();}
    ctx.globalAlpha=0.25+s.z*0.7;ctx.fillRect(s.x*W,s.y*H,1+s.z*1.4,1+s.z*2.4);}
  ctx.globalAlpha=1;
  if(!G)return;
  var sx=G.shake>0?(Math.random()-0.5)*G.shake:0,sy=G.shake>0?(Math.random()-0.5)*G.shake:0;
  ctx.save();ctx.translate(sx,sy);
  ctx.lineJoin='round';
  // player bullets
  glow('#5ff3ff',3,8);
  ctx.beginPath();for(i=0;i<B.length;i++){ctx.moveTo(B[i].x,B[i].y);ctx.lineTo(B[i].x-B[i].vx*0.015,B[i].y+12);}ctx.stroke();
  // enemy bullets
  ctx.fillStyle='#ff4fd8';ctx.shadowColor='#ff4fd8';ctx.shadowBlur=10;
  for(i=0;i<EB.length;i++){ctx.beginPath();ctx.arc(EB[i].x,EB[i].y,5,0,6.283);ctx.fill();}
  // enemies
  for(i=0;i<E.length;i++){
    var e=E[i];ctx.save();ctx.translate(e.x,e.y);
    var col=e.f>0?'#ffffff':e.k==='drone'?'#ff5a5a':e.k==='weaver'?'#c28bff':'#ffb347';
    glow(col,2,10);ctx.fillStyle='rgba(255,255,255,.06)';
    if(e.k==='drone')poly([[0,13],[12,-11],[0,-5],[-12,-11]]);
    else if(e.k==='weaver')poly([[0,-15],[14,0],[0,15],[-14,0]]);
    else{ctx.beginPath();for(var a=0;a<6;a++){var an=a*1.047+0.52;ctx.lineTo(Math.cos(an)*24,Math.sin(an)*24);}ctx.closePath();}
    ctx.fill();ctx.stroke();
    if(e.k==='weaver'){ctx.beginPath();ctx.arc(0,0,4,0,6.283);ctx.stroke();}
    if(e.k==='tank'){ctx.shadowBlur=0;ctx.strokeStyle='rgba(255,179,71,.35)';ctx.strokeRect(-18,30,36,4);ctx.fillStyle='#ffb347';ctx.fillRect(-18,30,36*e.hp/e.max,4);}
    ctx.restore();
  }
  // powerups
  for(i=0;i<PU.length;i++){var p=PU[i],pc=p.k==='W'?'#6dff8a':p.k==='S'?'#6fb4ff':'#ff4fd8';
    ctx.save();ctx.translate(p.x,p.y);glow(pc,2,12);ctx.rotate(Math.sin(p.a)*0.3);
    ctx.strokeRect(-11,-11,22,22);ctx.shadowBlur=0;ctx.fillStyle=pc;ctx.font='13px '+getComputedStyle(document.body).fontFamily;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(p.k==='W'?'W':p.k==='S'?'S':'+',0,1);ctx.restore();}
  // ship
  if(!ship.dead&&(ship.inv<=0||Math.floor(ship.inv*14)%2===0)){
    ctx.save();ctx.translate(ship.x,ship.y);
    var fl=8+Math.random()*10;
    glow('#ffb347',2,10);poly([[-5,10],[0,10+fl],[5,10]]);ctx.stroke();
    glow('#5ff3ff',2.5,14);ctx.fillStyle='rgba(95,243,255,.14)';
    poly([[0,-19],[13,15],[0,9],[-13,15]]);ctx.fill();ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,5);ctx.stroke();
    if(ship.shield){glow('#6fb4ff',2,16);ctx.beginPath();ctx.arc(0,0,27,0,6.283);ctx.stroke();}
    ctx.restore();
  }
  // particles
  ctx.shadowBlur=0;
  for(i=0;i<PT.length;i++){var r=PT[i];ctx.globalAlpha=Math.max(0,r.l/r.m);ctx.fillStyle=r.c;ctx.fillRect(r.x-1.5,r.y-1.5,3,3);}
  ctx.globalAlpha=1;ctx.restore();
}

var last=performance.now();
function loop(now){
  var dt=Math.min(0.033,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  else if(G){for(var i=PT.length-1;i>=0;i--){var r=PT[i];r.x+=r.vx*dt;r.y+=r.vy*dt;r.l-=dt;if(r.l<=0)PT.splice(i,1);}}
  render(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
